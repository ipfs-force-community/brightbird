apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: genesis-{{.UniqueId}}-statefulset
spec:
  replicas: 1
  serviceName: genesis-{{.UniqueId}}-svc
  selector:
    matchLabels:
      app: genesis-{{.UniqueId}}-pod
  template:
    metadata:
      name: genesis-{{.UniqueId}}-pod
      labels:
        app: genesis-{{.UniqueId}}-pod
    spec:
      containers:
        - name: genesis-{{.UniqueId}}
          image: "{{if gt (len .Registry) 0}}{{.Registry}}/{{end}}filvenus/lotus:{{.CodeVersion}}"
          imagePullPolicy: Always
          command: 
            - /bin/sh
            - '-c'
            - >-
              mkdir -p /root/genesis-dir && 
              /lotus-seed pre-seal --sector-size $SECTOR_SIZE --num-sectors 1 && 
              /lotus-seed genesis new /root/genesis-dir/localnet.json && 
              /lotus-seed genesis set-vrk --account f3v5dbvxeibanltz7jfrcsm76ixkps4exdt3g4uwfti2vte5btcwb5joi47yz5lehm6wbzdrcznjoff33zmbxa  /root/genesis-dir/localnet.json && 
              /lotus-seed genesis add-miner /root/genesis-dir/localnet.json ~/.genesis-sectors/pre-seal-f01000.json && 
              /lotus daemon --config /root/config.toml --lotus-make-genesis=/root/genesis-dir/devgen.car --genesis-template=/root/genesis-dir/localnet.json --bootstrap=false
          ports:
            - containerPort: 1234
              protocol: TCP
            - containerPort: 34567
              protocol: TCP
          env:
            - name: SECTOR_SIZE
              value: 8388608
            - name: FIL_PROOFS_PARAMETER_CACHE
              value: "/shared-dir/filecoin-proof-parameters"
            - name: IPFS_GATEWAY
              value: "https://proof-parameters.s3.cn-south-1.jdcloud-oss.com/ipfs/"
          volumeMounts:
            - mountPath: /shared-dir
              name: shared-dir-v
              subPath: {{.NameSpace}}
            - mountPath: /root/genesis-dir
              name: genesis-pvc
            - name: lotuscfg
              mountPath: "/root/config.toml"
              subPath: "config.toml"
      volumes:
        - name: shared-dir-v
          persistentVolumeClaim:
            claimName: shared-dir
        - name: lotuscfg
          configMap:
            name: genesis-cfg-{{.UniqueId}}
            items:
              - key: config.toml
                path: config.toml
  volumeClaimTemplates:
    - metadata:
        name: genesis-pvc
        labels:
          app: genesis-{{.UniqueId}}-pvc
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: "nfs-client"
        resources:
          requests:
            storage: 10Gi
            