---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations: {}
  labels:
    k8s.kuboard.cn/name: ui
  name: ui
  namespace: brightbird
spec:
  replicas: 1
  selector:
    matchLabels:
      k8s.kuboard.cn/name: ui
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
      labels:
        k8s.kuboard.cn/name: ui
    spec:
      containers:
        - env:
            - name: VITE_AXIOS_BASE_URL
              value: 'http://192.168.200.62:31007/api/v1'
          image: '192.168.200.60/filvenus/front:latest'
          imagePullPolicy: Always
          name: ui
          ports:
            - containerPort: 80
              name: ui-port
              protocol: TCP
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      imagePullSecrets:
        - name: harbor
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  annotations: {}
  labels:
    k8s.kuboard.cn/name: ui
  name: ui
  namespace: brightbird
spec:
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - name: web-serv-port
      nodePort: 30791
      port: 30791
      protocol: TCP
      targetPort: 80
  selector:
    k8s.kuboard.cn/name: ui
  sessionAffinity: None
  type: NodePort

